[package]
name = "np-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
np-audio = { path = "../np-audio" }
np-sources = { path = "../np-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all"] }
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
brotli = "9.1"
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
