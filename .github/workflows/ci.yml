name: CI

# Nowhere Player 门禁：Rust fmt / clippy / test，Windows + Ubuntu。

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace
