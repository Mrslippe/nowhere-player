[package]
name = "nowhere-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "nowhere_desktop"
path = "src/lib.rs"

[[bin]]
name = "nowhere-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
np-app = { path = "../../../crates/np-app" }
np-audio = { path = "../../../crates/np-audio" }
np-core = { path = "../../../crates/np-core" }
np-library = { path = "../../../crates/np-library" }
np-sources = { path = "../../../crates/np-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2"
